<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مفاجأة ليكِ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&family=Great+Vibes&display=swap">
<style>
:root{
  color-scheme:light;--bg:#fff;--paper:#fff;--ink:#c2365a;--rose:#e0507a;--card:#fff;--back:#fde3ea;--on-back:#c2365a;--muted:#e58aa6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;line-height:1.9;overflow-x:hidden}
.display{font-family:"Aref Ruqaa","Amiri","Traditional Arabic",serif}

/* Stage 1: sealed surprise */
#intro{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;
  background:#fff;color:#c2365a;position:relative;overflow:hidden;transition:opacity .9s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(3rem,13vw,5.4rem);margin:0 0 .6rem;font-weight:400;line-height:1.2}
#intro p{margin:0 0 1.6rem;color:#e0507a;font-size:1.1rem}
#openBtn{font:inherit;font-weight:700;font-size:1.15rem;color:#fff;background:#e0507a;border:0;border-radius:999px;padding:.9rem 2.4rem;cursor:pointer;box-shadow:0 0 0 0 rgba(224,80,122,.45);animation:pulse 2.4s infinite}
#openBtn:hover{background:#e8668c}
#openBtn:focus-visible,.rc:focus-visible{outline:3px solid #e0507a;outline-offset:4px}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(224,80,122,0)}100%{box-shadow:0 0 0 0 rgba(224,80,122,0)}}
#count{font-family:"Aref Ruqaa",serif;font-size:7rem;line-height:1;min-height:7rem;color:#e0507a}
#count.pop{animation:pop .9s ease both}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:.85}}

.date{display:flex;gap:.7rem;justify-content:center;margin-bottom:1.4rem}
.date input{font:inherit;font-size:1.4rem;width:4.4rem;text-align:center;color:#c2365a;background:#fff;border:2px solid #f6c1d0;border-radius:14px;padding:.6rem .3rem}
.date input:focus{outline:none;border-color:#e0507a}
.date #yy{width:6rem}
.date input::placeholder{color:#f0a9bd}
#pre #err{min-height:1.8em;margin:1rem 0 0;font-size:1rem;color:#c2365a}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cake-area{position:relative;height:19rem;border:2px dashed #f6c1d0;border-radius:24px;overflow:hidden}
.cake{position:absolute;width:7rem;height:7rem;padding:0;border:0;background:none;cursor:pointer;left:calc(50% - 3.5rem);top:calc(50% - 3.5rem);transition:left .45s cubic-bezier(.5,1.6,.5,1),top .45s cubic-bezier(.5,1.6,.5,1)}
.cake svg{width:100%;height:100%;display:block}
.cake:focus-visible{outline:3px solid var(--rose);outline-offset:4px;border-radius:16px}
.bubble{position:absolute;top:1rem;left:50%;width:min(88%,20rem);background:var(--rose);color:#fff;border-radius:20px;padding:.9rem 1.1rem;text-align:center;font-size:1.6rem;line-height:1.6;transform:translateX(-50%);animation:pop2 .6s ease both}
.bubble[hidden]{display:none}
@keyframes pop2{0%{opacity:0;transform:translateX(-50%) scale(.6)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
/* Petals */
.petal{position:fixed;top:-30px;width:14px;height:18px;border-radius:150% 0 150% 0;background:#e8879c;opacity:.8;pointer-events:none;z-index:5;animation:fall linear forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(var(--sway),55vh,0) rotate(180deg)}100%{transform:translate3d(calc(var(--sway) * -1),115vh,0) rotate(400deg)}}

/* Stage 2 */
#main{max-width:40rem;margin:0 auto;padding:3rem 1.25rem 4rem}
#main[hidden]{display:none}
.hello{text-align:center;font-family:"Great Vibes","Snell Roundhand","Segoe Script",cursive;font-weight:400;font-size:clamp(2.8rem,11vw,4.6rem);line-height:1.3;margin:0 0 2rem}
.letter{background:var(--paper);border:1.5px solid #f6c1d0;border-radius:6px 28px 6px 28px;padding:2rem 1.6rem;box-shadow:0 18px 40px -22px rgba(90,20,60,.45);font-size:1.15rem;max-width:34rem;margin:0 auto}
.letter p{margin:0 0 1.1rem}
.sign{font-size:1.7rem;color:var(--rose);text-align:left;margin:1.4rem 0 0 !important}
h2{text-align:center;font-size:clamp(1.7rem,5.5vw,2.3rem);margin:4rem 0 .3rem}
.sub{text-align:center;color:var(--muted);margin:0 0 1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.9rem}
.rc{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;perspective:700px;aspect-ratio:1/1.05}
.rc-in{position:relative;width:100%;height:100%;transition:transform .6s ease;transform-style:preserve-3d}
.rc[aria-pressed="true"] .rc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:.9rem;text-align:center}
.front{background:var(--card);border:1.5px solid #f6c1d0;box-shadow:0 10px 24px -16px rgba(90,20,60,.5);color:var(--rose);font-size:.95rem}
.front svg{width:2.4rem;height:2.4rem;fill:var(--rose)}
.back{background:var(--back);color:var(--on-back);transform:rotateY(180deg);font-weight:500;font-size:1rem;line-height:1.6}
.end{text-align:center;margin-top:4.5rem}
.end .display{font-size:clamp(2.2rem,8vw,3.4rem);color:var(--rose);margin:0;line-height:1.4}
.end button{font:inherit;margin-top:1.2rem;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:.7rem 1.8rem;font-weight:700;cursor:pointer}
.end button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.petal{display:none}#openBtn{animation:none}.rc-in{transition:none}}
</style>
</head>
<body>

<section id="intro">
  <div id="count" aria-live="polite"></div>
  <div id="pre">
    <h1 class="hello" dir="ltr">Happy Birthday, my love</h1>
    <p>اكتبي يوم وشهر وسنة ميلادك عشان تتفتح</p>
    <div class="date" dir="rtl">
      <input id="dd" inputmode="numeric" maxlength="2" placeholder="اليوم" aria-label="اليوم">
      <input id="mm" inputmode="numeric" maxlength="2" placeholder="الشهر" aria-label="الشهر">
      <input id="yy" inputmode="numeric" maxlength="4" placeholder="السنة" aria-label="السنة">
    </div>
    <button id="openBtn" type="button">دوسي هنا</button>
    <p id="err" role="alert"></p>
  </div>
</section>

<main id="main" hidden>
  <article class="letter" id="letter"></article>

  <h2 class="display">في تورتة ليكي</h2>
  <p class="sub" id="hint">حاولي تمسكيها، اضغطي على التورتة</p>
  <div class="cake-area" id="area" dir="ltr">
    <div class="bubble display" id="bubble" dir="rtl" hidden></div>
    <button class="cake" id="cake" type="button" aria-label="التورتة">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="90" rx="44" ry="7" fill="#fde3ea" stroke="#f6c1d0" stroke-width="2"/>
        <rect x="10" y="60" width="80" height="28" rx="7" fill="#f6b9c6"/>
        <rect x="20" y="38" width="60" height="26" rx="7" fill="#fde3ea" stroke="#f6c1d0" stroke-width="2"/>
        <path d="M20 46c6 0 6 8 12 8s6-8 12-8 6 8 12 8 6-8 12-8 6 8 12 8" fill="none" stroke="#e0507a" stroke-width="3" stroke-linecap="round"/>
        <rect x="48" y="22" width="4" height="16" rx="2" fill="#e0507a"/>
        <ellipse cx="50" cy="17" rx="4" ry="6" fill="#ffb347"/>
        <circle cx="28" cy="72" r="4" fill="#e0507a"/><circle cx="50" cy="74" r="4" fill="#e0507a"/><circle cx="72" cy="72" r="4" fill="#e0507a"/>
      </svg>
    </button>
  </div>

  <div class="end">
    <p class="display" id="endText"></p>
    <button type="button" id="moreBtn">مطر ورد تاني</button>
  </div>
</main>

<script>
/* ===== عدّلي الكلام من هنا ===== */
var CONFIG = {
  name: "يا قلبي",
  from: "حبيبك",
  letter: [
    "مش عارف أبدأ منين… بس اللي أنا متأكد منه إن وجودك في حياتي خلّى الأيام العادية أحلى بكتير.",
    "ضحكتك بتصلّح يومي، وصوتك بيهدّيني، ومعاكي بحس إني في بيتي.",
    "النهارده يومك إنتي، وأنا محظوظ إني بحتفل بيكي. وإن شاء الله السنة الجاية تبقي مراتي، وكل سنة نكون سوا ومع بعض، وكل سنة وإنتي حبيبتي.",
    "بحبك أكتر مما الكلام يقدر يقول."
  ],
  reasons: [
    "ضحكتك بتنوّر أي مكان",
    "طيبة قلبك مع كل الناس",
    "بتسمعيني حتى لو مش بقول حاجة",
    "معاكِ الأيام الوحشة بتعدّي أسهل",
    "بتاخدي بالك من أصغر التفاصيل",
    "بتخليني نسخة أحسن مني",
    "حتى لما تزعلي بتبقي قمر",
    "ببساطة… عشان انتِ انتِ"
  ],
  end: "كل سنة وإنتي حبيبتي",
  cakeMsg: "كل سنة وإنتي طيبة يا عمري",
  birthday: { day: 15, month: 12, year: 2000 } /* يوم وشهر عيد ميلادها */
};
/* ================================ */

var $ = function(id){ return document.getElementById(id); };
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

$("letter").innerHTML = CONFIG.letter.map(function(t){ return "<p>" + t + "</p>"; }).join("") +
  '<p class="sign display">— ' + CONFIG.from + "</p>";
$("endText").textContent = CONFIG.end;

var area = $("area"), cake = $("cake"), hint = $("hint"), tries = 0, done = false;
var hints = ["هربت منك! حاولي تاني", "هربت تاني! كمان مرة", "هربت ٢ مرات وتعبت… اضغطي عليها تاني"];
function place(x, y){ cake.style.left = x + "px"; cake.style.top = y + "px"; }
cake.addEventListener("click", function(){
  if(done) return;
  var aw = area.clientWidth - cake.offsetWidth, ah = area.clientHeight - cake.offsetHeight;
  if(tries < 3){
    hint.textContent = hints[tries]; tries++;
    place(Math.random()*aw, Math.random()*ah);
    return;
  }
  done = true;
  place(aw/2, ah - 8);
  var b = $("bubble"); b.textContent = CONFIG.cakeMsg; b.hidden = false;
  hint.textContent = "التورتة عايزة تقولكِ حاجة";
  petals(60, true);
});

var colors = ["#e8879c","#f4b6c2","#d9566f","#f9c6d2","#c04a78"];
function petals(n, fast){
  if(reduce) return;
  for(var i=0;i<n;i++){
    var p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.setProperty("--sway", (Math.random()*80-40) + "px");
    var d = fast ? 3 + Math.random()*3 : 9 + Math.random()*8;
    p.style.animationDuration = d + "s";
    p.style.animationDelay = (Math.random()*(fast?1.2:6)) + "s";
    p.style.transform = "scale(" + (0.7+Math.random()*0.9) + ")";
    document.body.appendChild(p);
    setTimeout(function(el){ el.remove(); }, (d+8)*1000, p);
  }
}
petals(12, false);
setInterval(function(){ if(!document.hidden) petals(3,false); }, 5000);

function num(v){ return parseInt(String(v).replace(/[٠-٩]/g, function(d){ return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }), 10); }
["dd","mm","yy"].forEach(function(id){ $(id).addEventListener("keydown", function(e){ if(e.key === "Enter") $("openBtn").click(); }); });
$("openBtn").addEventListener("click", function(){
  if(num($("dd").value) !== CONFIG.birthday.day || num($("mm").value) !== CONFIG.birthday.month || num($("yy").value) !== CONFIG.birthday.year){
    $("err").textContent = "مش التاريخ ده يا قمر، جرّبي تاني";
    var dt = document.querySelector(".date"); dt.classList.remove("shake"); void dt.offsetWidth; dt.classList.add("shake");
    return;
  }
  $("err").textContent = "";
  $("pre").style.display = "none";
  var c = $("count"), n = 3;
  function tick(){
    if(n === 0){
      c.textContent = "";
      petals(70, true);
      $("main").hidden = false;
      $("intro").classList.add("gone");
      setTimeout(function(){ $("intro").style.display = "none"; window.scrollTo(0,0); }, 900);
      return;
    }
    c.textContent = n;
    c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
    n--; setTimeout(tick, 1000);
  }
  tick();
});
$("moreBtn").addEventListener("click", function(){ petals(60, true); });
</script>
</body>
</html>
